name: Release packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to publish, e.g. v0.1.0 (empty = build only)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    if: github.repository == 'kkltgood/tramoing'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      commit: ${{ steps.metadata.outputs.commit }}
      tag: ${{ steps.metadata.outputs.tag }}
      publish: ${{ steps.metadata.outputs.publish }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - name: Validate requested tag
        shell: bash
        run: |
          if [[ -n "$RELEASE_TAG" && ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Use a version tag such as v0.1.0, or leave it empty to build only.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'push' && github.ref) || (inputs.tag && format('refs/tags/{0}', inputs.tag)) || github.sha }}
          persist-credentials: false
      - name: Read and verify release version
        id: metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          with open('Cargo.toml', 'rb') as manifest:
              version = tomllib.load(manifest)['workspace']['package']['version']
          if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version):
              raise SystemExit('Installer releases require a version such as 0.1.0.')
          if any(int(part) > 65535 for part in version.split('.')):
              raise SystemExit('Windows installer version components must be <= 65535.')
          tag = os.environ.get('RELEASE_TAG', '')
          if tag and tag != f'v{version}':
              raise SystemExit(f'Tag {tag} does not match Cargo.toml version {version}.')
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          publish = 'true' if tag else 'false'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'version={version}\ncommit={commit}\ntag={tag}\npublish={publish}\n')
          mode = f'Publish {tag}' if tag else 'Build only; download packages from workflow artifacts'
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(
              f'{mode}\n\nVersion: `{version}`\n\nCommit: `{commit}`\n', encoding='utf-8')
          PY

  build:
    name: Package ${{ matrix.platform }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
            suffix: -setup.exe
          - platform: macos-universal
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            suffix: .dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.targets }}
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Install NSIS if needed
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installed = (Get-Command makensis -ErrorAction SilentlyContinue) -or
            (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe") -or
            (Test-Path "$env:ProgramFiles\NSIS\makensis.exe")
          if (-not $installed) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          }
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: powershell
        run: ./packaging/windows/build.ps1 -Version $env:RELEASE_VERSION
      - name: Build macOS universal DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash scripts/package-macos.sh
          lipo dist/Tramoing.app/Contents/MacOS/tramoing -verify_arch arm64 x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/Tramoing-${{ needs.prepare.outputs.version }}${{ matrix.suffix }}
            dist/Tramoing-${{ needs.prepare.outputs.version }}${{ matrix.suffix }}.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-files
          merge-multiple: true
      - name: Verify assets and publish
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const version = process.env.RELEASE_VERSION;
            const tag = process.env.RELEASE_TAG;
            const packages = [`Tramoing-${version}-setup.exe`, `Tramoing-${version}.dmg`];
            const names = packages.flatMap(name => [name, `${name}.sha256`]).sort();
            const directory = 'release-files';
            const actual = fs.readdirSync(directory).sort();
            if (JSON.stringify(actual) !== JSON.stringify(names)) {
              throw new Error(`Unexpected release assets: ${actual.join(', ')}`);
            }
            for (const name of packages) {
              const file = fs.readFileSync(path.join(directory, name));
              if (!file.length) throw new Error(`Empty package: ${name}`);
              const checksum = fs.readFileSync(path.join(directory, `${name}.sha256`), 'utf8').trim();
              const digest = crypto.createHash('sha256').update(file).digest('hex');
              if (checksum !== `${digest}  ${name}`) throw new Error(`Checksum mismatch: ${name}`);
            }

            const { owner, repo } = context.repo;
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (release && !release.draft) {
              throw new Error(`${tag} is already published. Use a new version instead of replacing its files.`);
            }
            if (!release) {
              release = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, name: `Tramoing ${tag}`, draft: true,
                generate_release_notes: true,
                body: '安装包：Windows 10/11 x64 使用 `-setup.exe`；macOS 11+（Apple Silicon / Intel）使用通用 `.dmg`。\n\n每个安装包均附带 SHA-256 校验文件。Windows 安装包尚未做代码签名；macOS 使用 ad-hoc 签名，尚未进行 Developer ID 签名及公证。'
              })).data;
            }
            for (const name of names) {
              const existing = release.assets.find(asset => asset.name === name);
              if (existing) await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: existing.id });
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name,
                data: fs.readFileSync(path.join(directory, name))
              });
            }
            const published = (await github.rest.repos.updateRelease({
              owner, repo, release_id: release.id, draft: false
            })).data;
            core.notice(`Published ${published.html_url}`);
            await core.summary.addLink(`Tramoing ${tag}`, published.html_url).write();
