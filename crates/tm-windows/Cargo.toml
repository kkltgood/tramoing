[package]
name = "tm-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
# 给 tramoing-helper.exe 塞图标（见 build.rs）
build = "build.rs"

[[bin]]
name = "tramoing-helper"
path = "src/bin/tramoing_helper.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
tm-core = { path = "../tm-core" }
tm-diagnostics = { path = "../tm-diagnostics" }
log = "0.4"
tm-sampler = { path = "../tm-sampler" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
tempfile = "3"
# 用 windows-sys 而不是 windows：ETW 是一堆裸 C 结构体，
# windows-sys 就是 1:1 的 FFI 声明，没有 Result 包装和智能指针，写起来更直观；
# 而且它已经是 winit 的依赖，本地有缓存，不用再下一坨几百 MB 的 crate。
windows-sys = { version = "0.59", features = [
    "Wdk_Graphics_Direct3D",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Rpc",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
] }
