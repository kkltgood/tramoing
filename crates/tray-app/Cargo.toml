[package]
name = "tray-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
# 把图标 + VERSIONINFO 写进 exe（Windows）。macOS 的图标在 .app 包里，用不到。
build = "build.rs"

[[bin]]
name = "tramoing"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
tm-core = { path = "../tm-core" }
tm-diagnostics = { path = "../tm-diagnostics" }
tm-sampler = { path = "../tm-sampler" }
tm-store = { path = "../tm-store" }
eframe = "0.33"
# 只为了把 eframe/winit 的内部告警接到 stderr（见 main.rs 的 `TM_LOG`）。
# 没有它，多 viewport 出问题时只能看到一个「什么都没画」的窗口。
log = "0.4"

# ---- 更新检测（见 update.rs）----
# TLS 走系统实现：Windows 是 SChannel、macOS 是 Security.framework。
# **不能**用默认的 rustls：它带 ring，Windows 上要 nasm/CMake 才能编 asm，
# 直接把「装个 Rust 就能编」这条底线破掉。native-tls 只多一个薄封装。
ureq = { version = "3", default-features = false, features = ["native-tls", "platform-verifier", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 版本比较不用自己写：`1.10` > `1.9` 这种按字典序会判反，pre-release 也要按规则排。
semver = "1"
# 安装包校验。纯 Rust，没有编译期依赖。
sha2 = "0.10"
tempfile = "3"
url = "2"

# 两个平台实现互斥：macOS 走 nettop（tm-macos），Windows 走 ETW 助手（tm-windows）。
# 不能都当普通依赖，否则在 Windows 上会把 macOS 的 libproc FFI 也编进去。
[target.'cfg(target_os = "macos")'.dependencies]
tm-macos = { path = "../tm-macos" }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
tm-windows = { path = "../tm-windows" }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_UI_WindowsAndMessaging",
] }
# macOS 改用原生 NSStatusItem（见 tm-macos/src/status_item.rs），
# 这个 crate 只留给 Windows 的托盘实现
tray-icon = "0.24"
