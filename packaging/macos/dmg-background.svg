<svg xmlns="http://www.w3.org/2000/svg" width="700" height="460" viewBox="0 0 700 460">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f6f9fd"/>
      <stop offset="1" stop-color="#eaf1f8"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop stop-color="#93b7d9"/>
      <stop offset="1" stop-color="#3178b9"/>
    </linearGradient>
  </defs>
  <rect width="700" height="460" fill="url(#base)"/>
  <circle cx="645" cy="-40" r="210" fill="#dce9f5" opacity=".5"/>
  <g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" text-anchor="middle">
    <text x="350" y="67" fill="#1b344d" font-size="32" font-weight="600" letter-spacing="-.7">Tramoing</text>
    <text x="350" y="103" fill="#3c5268" font-size="17">双击安装，或拖入应用程序</text>
    <text x="350" y="126" fill="#6a8096" font-size="12">Double-click to install, or drag into Applications.</text>
    <rect x="45" y="155" width="610" height="174" rx="22" fill="#fff" fill-opacity=".78" stroke="#d8e4ef"/>
    <!-- Finder places the real, draggable icons at (190, 224) and (510, 224). -->
    <circle cx="190" cy="224" r="58" fill="#f0f5fa"/>
    <circle cx="510" cy="224" r="58" fill="#f0f5fa"/>
    <path d="M305 222H392M380 210L392 222L380 234" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="350" y="256" fill="#7290a9" font-size="11">拖入 / Drag</text>
    <text x="350" y="364" fill="#3c5268" font-size="14">安装后，在屏幕顶部菜单栏查看网速</text>
    <text x="350" y="386" fill="#6a8096" font-size="12">After opening, find Tramoing in your Mac's menu bar.</text>
    <path d="M270 413H430" stroke="#d0dfec"/>
    <text x="350" y="439" fill="#7d91a3" font-size="11">设置与历史记录会保留 · Your settings and history stay with you</text>
  </g>
</svg>
