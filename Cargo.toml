[workspace]
resolver = "2"
members = [
    "crates/tm-core",
    "crates/tm-sampler",
    "crates/tm-macos",
    "crates/tm-store",
    "crates/tm-windows",
    "crates/tray-app",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
authors = ["guolongkang"]
repository = "https://github.com/kkltgood/tramoing"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
